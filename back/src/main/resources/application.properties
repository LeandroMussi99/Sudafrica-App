# Conexión a la base de datos MySQL en Aiven
spring.datasource.url=jdbc:mysql://mysql-bf09c91-leanroman99-9029.g.aivencloud.com:11614/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&autoReconnect=true
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.idle-timeout=480000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000